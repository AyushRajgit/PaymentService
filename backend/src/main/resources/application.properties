spring.application.name=backend

server.port=${PORT}
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

cors.allowed-origins=${ALLOWED_ORIGINS}

jwt.secret=${JWT_SECRET_KEY}
jwt.expiration-ms=${JWT_EXPIRE_TIME}
jwt.issuer=${JWT_ISSUER}
jwt.audience=${JWT_AUDIENCE}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/amazonPay/auth/oauth2/callback/{registrationId}
frontend.oauth2-success-url=${FRONTEND_OAUTH_SUCCESS_URL}
